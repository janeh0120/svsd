<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif"><rect width="1440" height="900" fill="#FBFAF8"/><rect x="0" y="0" width="300" height="900" fill="#F3F1EE"/><text x="40" y="70" font-size="16" fill="#6B6B6B" font-weight="500" text-anchor="start" >Playbooks</text><text x="40" y="120" font-size="15" fill="#8C8C8C" font-weight="400" text-anchor="start" >Plan changes</text><text x="40" y="164" font-size="15" fill="#8C8C8C" font-weight="400" text-anchor="start" >Login recovery</text><text x="40" y="208" font-size="15" fill="#8C8C8C" font-weight="400" text-anchor="start" >Refunds</text><text x="40" y="252" font-size="15" fill="#8C8C8C" font-weight="400" text-anchor="start" >Billing handoffs</text><circle cx="400" cy="150" r="10" fill="none" stroke="#9A9A9A" stroke-width="2"/><text x="420" y="156" font-size="16" fill="#9A9A9A" font-weight="400" text-anchor="start" >Thought for 12s</text><text x="392" y="210" font-size="26" fill="#1E1E1E" font-weight="400" text-anchor="start" >48% of handoffs happen when customers can't get into</text><text x="392" y="246" font-size="26" fill="#1E1E1E" font-weight="400" text-anchor="start" >the email on their account.</text><rect x="392" y="296" width="640" height="120" rx="14" fill="#fff" stroke="#E6E6E6"/><text x="420" y="340" font-size="20" fill="#1E1E1E" font-weight="600" text-anchor="start" >Proposed playbook: Login recovery</text><text x="420" y="378" font-size="18" fill="#6B6B6B" font-weight="400" text-anchor="start" >Verify with phone number + last invoice amount instead</text><rect x="760" y="500" width="560" height="190" rx="18" fill="#fff" stroke="#E6E6E6"/><text x="790" y="548" font-size="20" fill="#1E1E1E" font-weight="400" text-anchor="start" >Love it. Check the invoice in</text><text x="1072" y="548" font-size="20" fill="#3B82F6" font-weight="500" text-anchor="start" >@stripe</text><text x="790" y="580" font-size="20" fill="#1E1E1E" font-weight="400" text-anchor="start" >and send the reset link by</text><text x="1040" y="580" font-size="20" fill="#3B82F6" font-weight="500" text-anchor="start" >@sms</text><rect x="790" y="620" width="96" height="36" rx="8" fill="#F5F5F5"/><text x="812" y="644" font-size="16" fill="#4B4B4B" font-weight="400" text-anchor="start" >Stripe</text><rect x="898" y="620" width="132" height="36" rx="8" fill="#F5F5F5"/><text x="920" y="644" font-size="16" fill="#4B4B4B" font-weight="400" text-anchor="start" >Twilio SMS</text></svg>